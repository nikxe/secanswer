services:
  db:
    image: pgvector/pgvector:pg16
    container_name: secanswer-db
    environment:
      POSTGRES_USER: secanswer
      POSTGRES_PASSWORD: secanswer
      POSTGRES_DB: secanswer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secanswer -d secanswer"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
