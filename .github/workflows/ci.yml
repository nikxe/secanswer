name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Unit tests are pure-Python: no DB or model runtime required.
      - name: Run unit tests
        working-directory: backend
        run: python -m unittest discover -s tests -v
